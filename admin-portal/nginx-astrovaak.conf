server {
    listen 80;
    server_name astrovaak.online www.astrovaak.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name astrovaak.online www.astrovaak.online;

    ssl_certificate /etc/letsencrypt/live/astrovaak.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrovaak.online/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/astrologer-portal/dist;
    index index.html;

    location /uploads/ {
        alias /var/www/astro-talk/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/admin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        alias /var/www/admin-portal/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
