# /etc/nginx/sites-available/astrovaak
# Symlink: ln -s /etc/nginx/sites-available/astrovaak /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name astrovaak.online www.astrovaak.online api.astrovaak.online;
    return 301 https://$host$request_uri;
}

# API server (api.astrovaak.online)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.astrovaak.online;

    ssl_certificate     /etc/letsencrypt/live/api.astrovaak.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.astrovaak.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase body size for file uploads
    client_max_body_size 20M;

    # WebSocket support (Socket.io)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Static uploads
    location /uploads/ {
        alias /var/www/astro-talk/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Frontend / preview (astrovaak.online)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astrovaak.online www.astrovaak.online;

    ssl_certificate     /etc/letsencrypt/live/astrovaak.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrovaak.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/astro-talk/preview;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
