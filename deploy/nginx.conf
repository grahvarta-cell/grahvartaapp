# /etc/nginx/sites-available/grahvarta
# Domains:
#   grahvarta.com / www.grahvarta.com  →  Astrologer portal + Admin portal at /admin
#   api.grahvarta.com                  →  Backend API + Socket.io

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grahvarta.com www.grahvarta.com api.grahvarta.com;
    return 301 https://$host$request_uri;
}

# ── API server (api.grahvarta.com) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/api.grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.grahvarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options       "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-XSS-Protection      "1; mode=block"                always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # WebSocket — Socket.io
    location /socket.io/ {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # Static uploads served by nginx (faster than Node)
    location /uploads/ {
        alias   /var/www/grahvarta/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # REST API
    location / {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  60s;
    }
}

# ── Frontend (grahvarta.com) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grahvarta.com www.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grahvarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Astrologer portal root
    root  /var/www/grahvarta/astrologer-portal;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Admin portal at /admin ─────────────────────────────────────────────
    # Files live at /var/www/grahvarta/admin/  (base: '/admin' in vite config)
    location ^~ /admin {
        root  /var/www/grahvarta;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Proxy /api/* to the backend (used by the admin portal) ────────────
    location ^~ /api/ {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        client_max_body_size   20M;
    }

    # ── Astrologer portal SPA fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA entry points
    location ~* (index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
