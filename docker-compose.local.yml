services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       grahvarta_db
      POSTGRES_USER:     grahvarta_user
      POSTGRES_PASSWORD: grahvarta2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grahvarta_user -d grahvarta_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env.local
    environment:
      DB_HOST: db
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_local:/app/uploads

  astrologer:
    build:
      context: ./astrologer-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped

  admin:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_local:/var/www/uploads:ro
    depends_on:
      - backend
      - astrologer
      - admin

volumes:
  postgres_data_local:
  uploads_local:
