services:

  # ── Database ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-grahvarta_db}
      POSTGRES_USER:     ${DB_USER:-grahvarta_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grahvarta_user} -d ${DB_NAME:-grahvarta_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override .env so the container talks to the 'db' service, not localhost
      DB_HOST: db
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  # ── Astrologer Portal ─────────────────────────────────────────────────────
  astrologer:
    build:
      context: ./astrologer-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.grahvarta.com}
    restart: unless-stopped

  # ── Admin Portal ──────────────────────────────────────────────────────────
  admin:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - astrologer
      - admin

volumes:
  postgres_data:
  uploads:
  certbot_webroot:
