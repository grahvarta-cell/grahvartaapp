<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Client &amp; Staff Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FA;
  --surface:#FFFFFF;
  --surface-2:#F8F9FD;
  --ink:#12131C;
  --ink-2:#4B4E5C;
  --muted:#8A8FA0;
  --border:#E7E9F2;
  --primary:#4338CA;
  --primary-ink:#FFFFFF;
  --primary-tint:#EEF0FE;
  --primary-tint-2:#E1E4FC;
  --success:#0E7A55;
  --success-tint:#E4F6EE;
  --warning:#A8620A;
  --warning-tint:#FFF2E0;
  --danger:#C22A3E;
  --danger-tint:#FCE9EC;
  --info:#0B6E7D;
  --info-tint:#E3F4F6;
  --neutral:#5B5F70;
  --neutral-tint:#EEEFF4;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-card:0 1px 2px rgba(18,19,28,.04), 0 8px 24px -12px rgba(18,19,28,.12);
  --shadow-phone:0 40px 80px -20px rgba(18,19,28,.45), 0 10px 30px -10px rgba(18,19,28,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #EDEBFF 0%, var(--bg) 55%);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.num,.figure{font-family:'Manrope',sans-serif;}
button{font-family:inherit;}

/* ---------- top mode switch ---------- */
.topbar{
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:22px 16px 8px;
}
.brand{
  position:absolute; left:24px; top:20px;
  display:flex; align-items:center; gap:8px;
  font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; color:var(--ink);
}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--primary);display:inline-block;}
.mode-switch{
  display:inline-flex; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:4px; box-shadow:var(--shadow-card);
}
.mode-btn{
  border:none; background:transparent; padding:9px 18px; border-radius:999px;
  font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.18s;
}
.mode-btn.active{background:var(--primary); color:#fff;}

/* ---------- stage ---------- */
.stage{ display:flex; justify-content:center; padding:28px 16px 60px; }

/* ---------- PHONE FRAME ---------- */
.phone{
  width:390px; height:844px; background:#0C0D12; border-radius:52px; padding:14px;
  box-shadow:var(--shadow-phone); position:relative; flex:0 0 auto;
}
.phone .inner{
  width:100%; height:100%; background:var(--bg); border-radius:38px; overflow:hidden;
  display:flex; flex-direction:column; position:relative;
}
.notch{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:120px; height:28px; background:#0C0D12; border-radius:16px; z-index:50;
}
.statusbar{
  height:46px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; font-size:13px; font-weight:600; color:var(--ink);
}
.statusbar .icons{display:flex; gap:5px; align-items:center;}

/* header */
.appheader{
  flex:0 0 auto; padding:6px 18px 14px; display:flex; align-items:center; gap:10px;
  background:var(--bg);
}
.appheader .backbtn{
  width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  box-shadow:var(--shadow-card);
}
.appheader .title{font-family:'Manrope',sans-serif; font-weight:700; font-size:17px; flex:1;}
.appheader .subtitle{font-size:12px; color:var(--muted); margin-top:1px; font-weight:500;}
.appheader .hbtn{
  width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  box-shadow:var(--shadow-card);
}
.badge-dot{position:absolute; top:-3px; right:-3px; width:9px;height:9px;background:var(--danger); border-radius:50%; border:2px solid var(--bg);}

/* body scroll */
.appbody{
  flex:1 1 auto; overflow-y:auto; padding:2px 18px 18px; background:var(--bg);
}
.appbody::-webkit-scrollbar{width:0;}
.appbody.no-pad{padding:0;}

/* bottom nav */
.bottomnav{
  flex:0 0 auto; display:flex; background:var(--surface); border-top:1px solid var(--border);
  padding:9px 6px 22px;
}
.navitem{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  color:var(--muted); font-size:10.5px; font-weight:600; padding:4px 0;
}
.navitem.active{color:var(--primary);}
.navitem svg{width:21px;height:21px;}

/* ---------- generic components ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px; box-shadow:var(--shadow-card);
}
.section-title{
  font-size:13px; font-weight:700; color:var(--ink-2); text-transform:none; margin:22px 0 10px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-title .link{font-size:12.5px; color:var(--primary); font-weight:700; cursor:pointer;}
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px;
  font-size:11px; font-weight:700;
}
.pill.success{background:var(--success-tint); color:var(--success);}
.pill.warning{background:var(--warning-tint); color:var(--warning);}
.pill.danger{background:var(--danger-tint); color:var(--danger);}
.pill.info{background:var(--info-tint); color:var(--info);}
.pill.neutral{background:var(--neutral-tint); color:var(--neutral);}
.pill.primary{background:var(--primary-tint); color:var(--primary);}
.btn{
  border:none; border-radius:12px; padding:13px 18px; font-weight:700; font-size:14px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%;
  transition:.15s;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{background:var(--surface); color:var(--ink); border:1.5px solid var(--border);}
.btn-ghost{background:transparent; color:var(--primary); font-weight:700;}
.btn-sm{padding:9px 14px; font-size:12.5px; width:auto;}
.row{display:flex; align-items:center;}
.between{justify-content:space-between;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.mt6{margin-top:6px;} .mt10{margin-top:10px;} .mt14{margin-top:14px;} .mt18{margin-top:18px;}
.avatar{
  width:42px;height:42px;border-radius:12px;background:var(--primary-tint); color:var(--primary);
  display:flex;align-items:center;justify-content:center; font-weight:800; font-size:15px; flex:0 0 auto;
}
.iconwrap{
  width:40px;height:40px;border-radius:11px; display:flex;align-items:center;justify-content:center;
  flex:0 0 auto; font-size:18px;
}
.divider{height:1px; background:var(--border); margin:14px 0;}
.listrow{display:flex; align-items:center; gap:12px; padding:12px 0; cursor:pointer;}
.listrow:not(:last-child){border-bottom:1px solid var(--border);}
.chip{
  padding:7px 13px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.scrollx{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.scrollx::-webkit-scrollbar{display:none;}
.progress-track{height:6px; background:var(--border); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--primary); border-radius:6px;}
.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state .emoji{font-size:38px; margin-bottom:10px;}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.check-anim{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{0%{transform:scale(0);} 70%{transform:scale(1.15);} 100%{transform:scale(1);}}

/* timeline */
.tl{position:relative; padding-left:26px;}
.tl-item{position:relative; padding-bottom:22px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute; left:-26px; top:2px; width:12px;height:12px;border-radius:50%; background:var(--border); border:2px solid var(--surface); box-shadow:0 0 0 2px var(--border);}
.tl-item.done::before{background:var(--success);}
.tl-item.current::before{background:var(--primary); box-shadow:0 0 0 4px var(--primary-tint);}
.tl-item::after{content:"";position:absolute; left:-21px; top:14px; width:1.5px; bottom:-4px; background:var(--border);}
.tl-item:last-child::after{display:none;}

/* upload dropzone */
.dropzone{
  border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:22px; text-align:center;
  background:var(--surface-2); cursor:pointer;
}
.dropzone:hover{border-color:var(--primary);}

/* chat */
.msg{max-width:78%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; margin-bottom:10px;}
.msg.them{background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px;}
.msg.me{background:var(--primary); color:#fff; margin-left:auto; border-bottom-right-radius:4px;}
.msg .time{font-size:10px; opacity:.65; margin-top:4px; display:block;}

/* keypad-ish OTP */
.otp-row{display:flex; gap:10px; justify-content:center; margin:26px 0 10px;}
.otp-box{width:46px;height:54px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center; font-size:20px; font-weight:700; font-family:'Manrope',sans-serif;}
.otp-box.filled{border-color:var(--primary); background:var(--primary-tint);}

.hidden{display:none !important;}

/* ---------- dark theme ---------- */
[data-theme="dark"]{
  --bg:#0E0F16; --surface:#181A24; --surface-2:#1F212D;
  --ink:#F2F2F7; --ink-2:#C7C9D6; --muted:#9297AA; --border:#2A2C3A;
  --primary:#6C63FF; --primary-tint:#232345; --primary-tint-2:#2A2A55;
  --success-tint:#12301F; --warning-tint:#332507; --danger-tint:#331019;
  --info-tint:#0C282D; --neutral-tint:#20212D;
  --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-phone:0 40px 80px -20px rgba(0,0,0,.7), 0 10px 30px -10px rgba(0,0,0,.5);
}
[data-theme="dark"] body{background:radial-gradient(1200px 600px at 50% -10%, #201C3D 0%, #0E0F16 55%);}
[data-theme="dark"] .brand{color:var(--ink);}
[data-theme="dark"] .statusbar svg path,[data-theme="dark"] .statusbar svg rect{fill:var(--ink) !important;}
[data-theme="dark"] .otp-box{color:var(--ink);}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
  background:#12131C; color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:600;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.5); z-index:200; display:flex; align-items:center; gap:8px;
}
[data-theme="dark"] .toast{background:#2A2C3A;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,10,16,.5); display:flex; align-items:center; justify-content:center;
  z-index:150; padding:20px;
}
.modal-card{
  background:var(--surface); border-radius:18px; padding:24px; width:100%; max-width:380px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.4); border:1px solid var(--border);
}

/* ---------- dropdown ---------- */
.dropdown-menu{
  position:absolute; right:0; top:34px; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; box-shadow:var(--shadow-card); z-index:30; min-width:158px; padding:6px;
}
.dropdown-item{padding:9px 12px; font-size:12.5px; font-weight:600; border-radius:7px; cursor:pointer; color:var(--ink-2);}
.dropdown-item:hover{background:var(--surface-2); color:var(--ink);}

/* ---------- toggle switch (settings) ---------- */
.toggle-sw{width:38px; height:22px; border-radius:12px; background:var(--border); position:relative; cursor:pointer; flex:0 0 auto;}
.toggle-sw.on{background:var(--primary);}
.toggle-sw .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s;}
.toggle-sw.on .knob{left:18px;}

/* ---------- STAFF PORTAL ---------- */
.staff-shell{
  width:100%; max-width:1180px; background:var(--surface); border-radius:24px; border:1px solid var(--border);
  box-shadow:var(--shadow-card); overflow:hidden; display:flex; min-height:760px;
}
.staff-side{
  width:224px; flex:0 0 auto; background:#15161F; color:#EDEEF6; padding:22px 14px; display:flex; flex-direction:column;
}
.staff-brand{display:flex; align-items:center; gap:9px; font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; padding:6px 10px 26px;}
.staff-brand .dot{width:9px;height:9px;border-radius:3px;background:#8B85FF;}
.staff-nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px; font-size:13.5px; font-weight:600;
  color:#B7B9CB; cursor:pointer; margin-bottom:2px;
}
.staff-nav-item.active{background:#242534; color:#fff;}
.staff-nav-item svg{width:17px;height:17px; opacity:.85;}
.staff-side-footer{margin-top:auto; padding:12px 10px; display:flex; align-items:center; gap:10px; border-top:1px solid #26273a; padding-top:16px;}
.staff-main{flex:1; display:flex; flex-direction:column; min-width:0;}
.staff-topbar{
  padding:20px 30px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
}
.staff-body{padding:26px 30px; overflow-y:auto; flex:1;}
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.kpi-card{background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:18px;}
.kpi-card .num{font-size:26px; font-weight:800;}
.kpi-card .lbl{font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px;}
.attn-card{background:var(--danger-tint); border:1px solid #F3C9CF; border-radius:16px; padding:18px;}
.staff-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.staff-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--border); font-weight:700;}
.staff-table td{padding:13px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
.staff-table tr:hover td{background:var(--surface-2); cursor:pointer;}
.tabs-row{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px;}
.tab-btn{padding:11px 16px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--primary); border-color:var(--primary);}

@media (max-width:1240px){
  .stage{flex-direction:column; align-items:center;}
}
@media (max-width:900px){
  .staff-shell{flex-direction:column; min-height:auto;}
  .staff-side{width:100%; flex-direction:row; overflow-x:auto; align-items:center; padding:12px;}
  .staff-brand{padding:6px 14px 6px 4px;}
  .staff-side-footer{display:none;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:430px){
  .phone{width:100%; max-width:390px; height:100svh; border-radius:0; padding:0;}
  .phone .inner{border-radius:0;}
  .notch{display:none;}
  .stage{padding:0;}
}
</style>
</head>

</div>

/* =========================================================================

   ========================================================================= */
let stack = [{screen:'splash', params:{}}];
let flow = {}; // scratch data for in-progress simulated flows

function current(){ return stack[stack.length-1]; }
function go(screen, params={}){ stack.push({screen, params}); render(); window.scrollTo(0,0); }
function replace(screen, params={}){ stack[stack.length-1] = {screen, params}; render(); }
function goBack(){ if(stack.length>1){ stack.pop(); render(); } }
function goRoot(screen, params={}){ stack = [{screen, params}]; render(); }

const NAV_SCREENS = ['dashboard','services','vault','tasks','profile'];
const HEADERLESS = ['splash','login','otp','onboarding'];

function fmtINR(n){ return '$' + n.toLocaleString('en-US'); }

/* =========================================================================

   ========================================================================= */
function renderChrome(){
  const {screen, params} = current();
  const headerEl = document.getElementById('appheader');
  const navEl = document.getElementById('bottomnav');

  if(HEADERLESS.includes(screen)){
    headerEl.innerHTML = '';
    navEl.innerHTML = '';
    return;
  }
  const titles = {
    dashboard:[t('greeting'), businesses.find(b=>b.id===activeBusinessId).name],
    services:['My Services', client.business],
    servicedetail:[services.find(s=>s.id===current().params.id)?.name || 'Service', 'Service details'],
    docrequests:['Document Requests','Pending uploads from your CA'],
    vault:['Documents Vault', 'All your files, organised'],
    calendar:['Compliance Calendar','Never miss a deadline'],
    tasks:['Tasks', client.business],
    invoices:['Invoices & Payments', client.business],
    invoicedetail:['Invoice', current().params.id||''],
    pay:['Payment', 'Choose a payment method'],
    paysuccess:['', ''],
    chat:['CPA Jennifer Reyes','Usually replies within an hour'],
    notifications:['Notifications', ''],
    profile:['Profile','Business details'],
    help:['Help & Support',''],
    filingflow:['Sales Tax Filing','August 2026'],
    docupload:['Upload Document', current().params.docName||''],
    noticedetail:['Tax Notice', gstNotices[0].id],
    search:['Search',''],
    requestservice:['Request a Service','Explore additional offerings'],
    tools:['Tax Tools','Quick calculators'],
    calculator:[params.tool==='tds'?'Payroll Tax Calculator':params.tool==='itr'?'Income Tax Calculator':'Sales Tax Calculator', 'Illustrative estimate'],
    refer:['Refer & Earn',''],
    docpreview:[current().params.name||'Document', current().params.cat||''],
  };
  const [title, sub] = titles[screen] || ['',''];
  const showBack = !NAV_SCREENS.includes(screen);
  const isPaySuccess = screen==='paysuccess';
  const unread = notifications.filter(n=>!n.read).length;
  const bellBadge = unread>0 ? `<span class="badge-dot" style="width:auto;min-width:15px;height:15px;border-radius:8px;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;">${unread}</span>` : '';

  headerEl.innerHTML = `
    ${showBack ? `<div class="backbtn" onclick="goBack()">${ICONS.back}</div>` : ''}
    <div style="flex:1;">
      ${title ? `<div class="title">${title}</div>` : ''}
      ${sub ? `<div class="subtitle" ${screen==='dashboard'?`onclick="openBusinessSwitcher()" style="cursor:pointer;"`:''}>${sub}${screen==='dashboard'?' ▾':''}</div>` : ''}
    </div>
    ${!showBack && !isPaySuccess ? `
      <div class="hbtn" onclick="go('search')">${ICONS.search}</div>
      <div class="hbtn" onclick="go('notifications')" style="margin-left:8px;">${ICONS.bell}${bellBadge}</div>
      <div class="hbtn" onclick="go('chat')" style="margin-left:8px;">${ICONS.chat}</div>
    ` : ''}
    ${showBack && !isPaySuccess && screen!=='chat' ? `
      <div class="hbtn" onclick="go('notifications')">${ICONS.bell}${bellBadge}</div>
    ` : ''}
  `;

  if(NAV_SCREENS.includes(screen)){
    const pendingTasks = tasksData.pending.length;
    const items = [
      {key:'dashboard', label:t('home'), icon:ICONS.home},
      {key:'services', label:t('services'), icon:ICONS.services},
      {key:'vault', label:t('documents'), icon:ICONS.docs},
      {key:'tasks', label:t('tasks'), icon:ICONS.tasks, badge:pendingTasks},
      {key:'profile', label:t('profile'), icon:ICONS.profile},
    ];
    navEl.innerHTML = items.map(it=>{
      const active = it.key===screen;
      const color = active ? '#4338CA' : '#8A8FA0';
      const badge = it.badge ? `<span style="position:absolute;top:-3px;right:-7px;background:var(--danger);color:#fff;font-size:8.5px;font-weight:800;min-width:13px;height:13px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 2px;">${it.badge}</span>` : '';
      return `<div class="navitem ${active?'active':''}" onclick="goRoot('${it.key}')"><div style="position:relative;">${it.icon(color)}${badge}</div><span>${it.label}</span></div>`;
    }).join('');
  } else {
    navEl.innerHTML = '';
  }
}

function render(){
  const {screen, params} = current();
  renderChrome();

  body.classList.toggle('no-pad', ['splash','login','otp','onboarding','paysuccess'].includes(screen));
  const fns = {
    splash: renderSplash, login: renderLogin, otp: renderOTP, onboarding: renderOnboarding,
    dashboard: renderDashboard, services: renderServices, servicedetail: renderServiceDetail,
    docrequests: renderDocRequests, vault: renderVault, calendar: renderCalendar,
    tasks: renderTasks, invoices: renderInvoices, invoicedetail: renderInvoiceDetail,
    pay: renderPay, paysuccess: renderPaySuccess, chat: renderChat, notifications: renderNotifications,
    profile: renderProfile, help: renderHelp, filingflow: renderFilingFlow, docupload: renderDocUpload,
    noticedetail: renderNoticeDetail, search: renderSearch, requestservice: renderRequestService,
    tools: renderTools, calculator: renderCalculator, refer: renderRefer, docpreview: renderDocPreview,
  };
  body.innerHTML = `<div class="fade-in">${(fns[screen]||renderDashboard)(params)}</div>`;
  attachDynamicHandlers(screen);
}

let _searchResults = [];
function buildSearchIndex(){
  const idx = [];
  services.forEach(s=> idx.push({type:'Service', icon:s.icon, label:s.name, sub:s.status, screen:'servicedetail', params:{id:s.id}}));
  invoices.forEach(i=> idx.push({type:'Invoice', icon:'💳', label:i.id, sub:i.desc, screen:'invoicedetail', params:{id:i.id}}));
  allVaultDocs.forEach(d=> idx.push({type:'Document', icon:d.icon, label:d.name, sub:d.cat, screen:'vault', params:{}}));
  ['pending','progress','done'].forEach(k=> tasksData[k].forEach(t=> idx.push({type:'Task', icon:'✓', label:t.title, sub:t.service, screen:'tasks', params:{}})));
  return idx;
}
function renderSearchResultsHTML(){
  const q = (flow.searchQuery||'').toLowerCase();
  if(!q){ _searchResults=[]; return `<div class="empty-state"><div class="emoji">🔎</div>Search across services, documents, invoices and tasks.</div>`; }
  const all = buildSearchIndex();
  _searchResults = all.filter(r=> r.label.toLowerCase().includes(q) || (r.sub||'').toLowerCase().includes(q));
  if(_searchResults.length===0) return `<div class="empty-state"><div class="emoji">🙈</div>No results for "${flow.searchQuery}"</div>`;
  return _searchResults.map((r,i)=>`
    <div class="card row" style="gap:12px;cursor:pointer;" onclick="searchGo(${i})">
      <div class="iconwrap" style="background:var(--primary-tint);">${r.icon}</div>
      <div style="flex:1;">
        <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:10px;">${r.type}</div>
        <div style="font-weight:700;font-size:13.5px;margin-top:2px;">${r.label}</div>
        <div class="small muted mt6">${r.sub}</div>
      </div>
    </div>
  `).join('');
}
function updateSearch(val){
  flow.searchQuery = val;
  const el = document.getElementById('searchResults');
  if(el) el.innerHTML = renderSearchResultsHTML();
}
function searchGo(i){ const r=_searchResults[i]; if(r) go(r.screen, r.params); }
function renderSearch(){
  return `
  <div class="mt10">
    <input type="text" autofocus placeholder="Search services, documents, invoices, tasks…" value="${flow.searchQuery||''}"
      oninput="updateSearch(this.value)"

function renderGstCalc(){
  return `
  <div class="card mt10">

    <input type="number" id="gstAmount" placeholder="e.g. 5000" oninput="computeGst()" style="${fieldStyle()}">

    <select id="gstType" onchange="computeGst()" style="${fieldStyle()}">
      <option value="excl">Exclusive of Sales Tax</option><option value="incl">Inclusive of Sales Tax</option>
    </select>

  <div class="section-title">Result</div>
  <div class="card" id="gstResult">Enter an amount to calculate.</div>
  <div style="height:8px;"></div>`;
}
function computeGst(){
  const amt = parseFloat(document.getElementById('gstAmount').value)||0;
  const rate = parseFloat(document.getElementById('gstRate').value);
  const type = document.getElementById('gstType').value;
  const el = document.getElementById('gstResult');
  if(amt<=0){ el.innerHTML='Enter an amount to calculate.'; return; }
  let base, tax;
  if(type==='excl'){ base=amt; tax=amt*rate/100; } else { base=amt/(1+rate/100); tax=amt-base; }
  const total = base+tax;
  el.innerHTML = `
    <div class="row between"><span class="small muted">Taxable Amount</span><span style="font-weight:700;">${fmtINR(Math.round(base))}</span></div>
    <div class="row between mt10"><span class="small muted">Sales Tax (${rate}%)</span><span style="font-weight:700;">${fmtINR(Math.round(tax))}</span></div>
    <div class="divider"></div>
    <div class="row between"><span style="font-weight:700;">Total Amount</span><span style="font-weight:800;font-size:16px;">${fmtINR(Math.round(total))}</span></div>`;
}
function renderTdsCalc(){

    <label class="small muted" style="font-weight:600;">Payment / Wage Amount ($)</label>

}
function computeTds(){
  const amt = parseFloat(document.getElementById('tdsAmount').value)||0;
  const rate = parseFloat(document.getElementById('tdsSection').value);
  const el = document.getElementById('tdsResult');
  if(amt<=0){ el.innerHTML='Enter a payment amount to calculate.'; return; }
  const withheld = amt*rate/100, net = amt-withheld;
  el.innerHTML = `
    <div class="row between"><span class="small muted">Withholding Rate</span><span style="font-weight:700;">${rate}%</span></div>
    <div class="row between mt10"><span class="small muted">Amount Withheld</span><span style="font-weight:700;color:var(--danger);">− ${fmtINR(Math.round(withheld))}</span></div>

    <div class="row between"><span style="font-weight:700;">Net Payable</span><span style="font-weight:800;font-size:16px;">${fmtINR(Math.round(net))}</span></div>`;
}
function renderItrCalc(){
  return `
  <div class="card mt10">
    <label class="small muted" style="font-weight:600;">Annual Income ($)</label>
    <input type="number" id="itrIncome" placeholder="e.g. 85000" oninput="computeItr()" style="${fieldStyle()}">
    <div class="small muted mt10">Estimated federal tax, single filer. Illustrative only — actual liability may vary with deductions and state tax.</div>
  </div>
  <div class="section-title">Result</div>
  <div class="card" id="itrResult">Enter your annual income to calculate.</div>
  <div style="height:8px;"></div>`;
}
function computeItr(){
  const income = parseFloat(document.getElementById('itrIncome').value)||0;
  const el = document.getElementById('itrResult');
  if(income<=0){ el.innerHTML='Enter your annual income to calculate.'; return; }
  const slabs = [[11600,.10],[47150,.12],[100525,.22],[191950,.24],[243725,.32],[Infinity,.35]];
  let tax=0, prev=0;
  for(const [limit,rate] of slabs){
    if(income>prev){ tax += (Math.min(income,limit)-prev)*rate; prev=limit; } else break;
  }
  el.innerHTML = `
    <div class="row between"><span class="small muted">Taxable Income</span><span style="font-weight:700;">${fmtINR(Math.round(income))}</span></div>
    <div class="divider"></div>
    <div class="row between"><span style="font-weight:700;">Estimated Federal Tax</span><span style="font-weight:800;font-size:16px;">${fmtINR(Math.round(tax))}</span></div>`;
}

function getFilteredVaultDocs(){
  const query = (flow.vaultQuery||'').toLowerCase();
  const activeFolder = flow.vaultFolder || 'All';
  return allVaultDocs.filter(d=>{
    const matchesFolder = activeFolder==='All' || d.cat===activeFolder;
    const matchesQuery = !query || d.name.toLowerCase().includes(query) || d.cat.toLowerCase().includes(query);
    return matchesFolder && matchesQuery;
  });
}
function updateVaultSearch(val){
  flow.vaultQuery = val;

  const countEl = document.getElementById('vaultResultCount');
  if(countEl) countEl.textContent = `${filtered.length} result${filtered.length!==1?'s':''}`;
}

let staffScreen = 'dashboard';
let staffParams = {};
let staffRole = 'ca';
function staffGo(screen, params={}){ staffScreen=screen; staffParams=params; flow.openRowMenu=null; renderStaff(); }
function setStaffRole(role){
  staffRole = role;
  document.getElementById('staffRoleLabel').textContent = role==='admin' ? 'Firm Admin' : 'Senior Associate';
  document.getElementById('roleCaBtn').classList.toggle('active', role==='ca');
  document.getElementById('roleAdminBtn').classList.toggle('active', role==='admin');
  if(role==='ca' && ['team','settings'].includes(staffScreen)) staffScreen='dashboard';
  renderStaff();
}

const STAFF_NAV_BASE = [
  {key:'dashboard', label:'Dashboard', icon:'▦'},
  {key:'clients', label:'Clients', icon:'👥'},
  {key:'tasks', label:'Tasks', icon:'✓'},
  {key:'documents', label:'Documents', icon:'📄'},
  {key:'filings', label:'Filings', icon:'🧾'},
  {key:'billing', label:'Billing', icon:'💳'},
  {key:'communication', label:'Communication', icon:'💬'},
  {key:'reports', label:'Reports', icon:'📈'},
];
function getStaffNav(){
  const items = [...STAFF_NAV_BASE];
  if(staffRole==='admin'){
    items.push({key:'team', label:'Team', icon:'🧑‍💼'});
    items.push({key:'settings', label:'Firm Settings', icon:'⚙️'});
  }
  return items;
}

function renderStaffNav(){
  document.getElementById('staffNav').innerHTML = getStaffNav().map(n=>`
    <div class="staff-nav-item ${staffScreen===n.key?'active':''}" onclick="staffGo('${n.key}')">
      <span style="width:17px;display:inline-block;text-align:center;">${n.icon}</span>${n.label}
    </div>
  `).join('');
}

const staffTitles = {
  dashboard:['Dashboard',"Welcome back, here's what needs attention today"],
  clients:['Clients','248 active clients across your firm'],
  clientprofile:['Client Workspace', staffParams.name||''],
  tasks:['Tasks','Firm-wide task tracker'],
  documents:['Documents','All client documents in one place'],
  filings:['Filings','Track filing status across clients'],
  billing:['Billing','Invoices and outstanding payments'],
  communication:['Communication','Messages across all clients'],
  reports:['Reports','Practice performance at a glance'],
  team:['Team','Manage staff workload and access'],
  settings:['Firm Settings','Branding, branches and subscription'],
};

function renderStaff(){
  renderStaffNav();
  document.getElementById('staffPageTitle').textContent = (staffTitles[staffScreen]||['',''])[0];
  document.getElementById('staffPageSub').textContent = staffScreen==='clientprofile' ? (staffParams.name||'') : (staffTitles[staffScreen]||['',''])[1];
  const fns = {
    dashboard: renderStaffDashboard, clients: renderStaffClients, clientprofile: renderStaffClientProfile,
    tasks: renderStaffTasks, documents: renderStaffDocuments, filings: renderStaffFilings,
    billing: renderStaffBilling, communication: renderStaffCommunication, reports: renderStaffReports,
    team: renderStaffTeam, settings: renderStaffSettings,
  };
  document.getElementById('staffBody').innerHTML = `<div class="fade-in">${(fns[staffScreen]||renderStaffDashboard)()}</div>`;
}

function renderAddClientModal(){

  let body='';

        <div><label class="small muted" style="font-weight:600;">Business Name</label><div class="mt6" style="border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13.5px;">Artisan Crafts Co.</div></div>

    body = `

        <div class="row between"><span class="small muted">Business</span><span style="font-weight:700;">Artisan Crafts Co.</span></div>
        <div class="row between mt10"><span class="small muted">Contact</span><span style="font-weight:700;">Emma Wilson</span></div>

     <div class="modal-card" onclick="event.stopPropagation()">

}

function getFilteredStaffClients(){
  const query = (flow.staffClientQuery||'').toLowerCase();
  const activeFilter = flow.staffClientFilter || 'All';
  return staffClients.filter(c=>{
    const matchesFilter = activeFilter==='All' || c.status===activeFilter;
    const matchesQuery = !query || c.name.toLowerCase().includes(query) || c.contact.toLowerCase().includes(query);
    return matchesFilter && matchesQuery;
  });
}
function renderStaffClientRows(filtered){
  if(filtered.length===0) return `<div class="empty-state"><div class="emoji">🔍</div>No clients match your search or filter.</div>`;
  const selected = flow.selectedClients || [];
  const allSelected = filtered.length>0 && filtered.every(c=>selected.includes(c.name));
  return `
  <table class="staff-table">
    <thead><tr>
      <th style="width:30px;"><input type="checkbox" ${allSelected?'checked':''} onchange="toggleSelectAllClients()"></th>
      <th>Client</th><th>Contact</th><th>Status</th><th>Pending</th><th>Outstanding</th><th></th></tr></thead>
    <tbody>
      ${filtered.map((c,i)=>`
        <tr onclick="staffGo('clientprofile',{name:'${c.name}'})">
          <td onclick="event.stopPropagation();"><input type="checkbox" ${selected.includes(c.name)?'checked':''} onchange="toggleClientSelect('${c.name}')"></td>
          <td style="font-weight:700;">${c.name}</td>
          <td>${c.contact}</td>
          <td><span class="pill ${c.color}">${c.status}</span></td>
          <td>${c.pending}</td>
          <td>${c.outstanding?fmtINR(c.outstanding):'—'}</td>
          <td style="position:relative;text-align:right;" onclick="event.stopPropagation();">
            <span class="chip" style="padding:5px 10px;" onclick="flow.openRowMenu = flow.openRowMenu==='${i}' ? null : '${i}'; renderStaff();">•••</span>
            ${flow.openRowMenu===String(i) ? `
              <div class="dropdown-menu">
                <div class="dropdown-item" onclick="flow.openRowMenu=null; flow.staffClientTab='communication'; staffGo('clientprofile',{name:'${c.name}'});">Message</div>
                <div class="dropdown-item" onclick="flow.openRowMenu=null; openAddTaskModal('${c.name}');">Assign Task</div>
                <div class="dropdown-item" onclick="flow.openRowMenu=null; staffGo('clientprofile',{name:'${c.name}'});">View Profile</div>
              </div>` : ''}
          </td>
        </tr>
      `).join('')}
    </tbody>
  </table>
  ${selected.length>0 ? `
  <div class="card row between" style="margin-top:14px;background:var(--primary-tint);border-color:var(--primary-tint-2);">
    <span style="font-weight:700;font-size:13px;color:var(--primary);">${selected.length} selected</span>
    <div class="row" style="gap:8px;">
      <button class="btn btn-secondary btn-sm" onclick="bulkSendReminder()">Send Reminder</button>
      <button class="btn btn-secondary btn-sm" onclick="flow.selectedClients=[]; renderStaff();">Clear</button>
    </div>
  </div>` : ''}`;
}
function toggleClientSelect(name){
  flow.selectedClients = flow.selectedClients || [];
  const i = flow.selectedClients.indexOf(name);
  if(i>-1) flow.selectedClients.splice(i,1); else flow.selectedClients.push(name);
  renderStaff();
}
function toggleSelectAllClients(){
  const filtered = getFilteredStaffClients();
  const selected = flow.selectedClients || [];
  const allSelected = filtered.length>0 && filtered.every(c=>selected.includes(c.name));
  flow.selectedClients = allSelected ? [] : filtered.map(c=>c.name);
  renderStaff();
}
function bulkSendReminder(){
  const n = (flow.selectedClients||[]).length;
  flow.selectedClients = [];
  renderStaff();
  showToast(`📨 Reminder sent to ${n} client${n!==1?'s':''}`);
}
function updateStaffClientSearch(val){
  flow.staffClientQuery = val;
  const el = document.getElementById('staffClientRows');
  if(el) el.innerHTML = renderStaffClientRows(getFilteredStaffClients());
}
function selectStaffClientFilter(f){ flow.staffClientFilter = f; renderStaff(); }
function renderStaffClients(){
  const activeFilter = flow.staffClientFilter || 'All';
  const filtered = getFilteredStaffClients();
  return `
  <div class="row between mt0" style="margin-bottom:16px;">
    <input type="text" placeholder="🔍 Search clients…" value="${flow.staffClientQuery||''}"
      oninput="updateStaffClientSearch(this.value)"

function renderTaskListView(){
  const stageInfo = {pending:['warning','Pending'], progress:['info','In Progress'], done:['success','Completed']};
  return `<table class="staff-table">
    <thead><tr><th>Task</th><th>Client</th><th>Due</th><th>Priority</th><th>Stage</th></tr></thead>
    <tbody>
      ${staffTaskBoard.map(t=>{
        const [color,label] = stageInfo[t.stage];
        return `<tr onclick="staffGo('clientprofile',{name:'${t.client}'})">
          <td style="font-weight:700;">${t.title}</td><td>${t.client}</td><td>${t.due}</td>
          <td><span class="pill ${t.priority==='High'?'danger':t.priority==='Medium'?'warning':'neutral'}">${t.priority}</span></td>
          <td><span class="pill ${color}">${label}</span></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;

function renderTaskBoard(){
  const cols = [['pending','Pending','warning'],['progress','In Progress','info'],['done','Completed','success']];
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">

        <div class="row between" style="margin-bottom:10px;">
          <span style="font-weight:700;font-size:12.5px;">${label}</span>
          <span class="pill ${color}">${staffTaskBoard.filter(t=>t.stage===key).length}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${staffTaskBoard.filter(t=>t.stage===key).map(t=>`
            <div class="card" draggable="true" ondragstart="dragTask(event,${t.id})" style="padding:12px;cursor:grab;">

              <div class="small muted mt6">${t.client}</div>

              </div>
            </div>
          `).join('') || `<div class="small muted" style="text-align:center;padding:20px 0;">No tasks</div>`}
        </div>
      </div>
    `).join('')}
  </div>`;

let _draggedTaskId = null;
function dragTask(e,id){ _draggedTaskId = id; e.dataTransfer.effectAllowed='move'; }
function dropTask(e, stage){
  e.preventDefault();

  if(task){ task.stage = stage; renderStaff(); }
}

function buildConicGradient(data){
  let acc=0; const stops=[];
  data.forEach(d=>{ const start=acc; acc+=d.pct; stops.push(`${d.color} ${start}% ${acc}%`); });
  return `conic-gradient(${stops.join(',')})`;
}

/* =========================================================================
   MODE SWITCH + INIT
   ========================================================================= */
function setMode(mode){
  document.getElementById('clientView').classList.toggle('hidden', mode!=='client');
  document.getElementById('staffView').classList.toggle('hidden', mode!=='staff');
  document.getElementById('modeClientBtn').classList.toggle('active', mode==='client');
  document.getElementById('modeStaffBtn').classList.toggle('active', mode==='staff');
  if(mode==='staff') renderStaff();
}

function toggleTheme(){
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  render();
  if(!document.getElementById('staffView').classList.contains('hidden')) renderStaff();
}
function updateClock(){
  const el = document.getElementById('clock');
  if(el) el.textContent = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).replace(' ','').toLowerCase().replace('am',' AM').replace('pm',' PM');
}
updateClock(); setInterval(updateClock, 30000);
