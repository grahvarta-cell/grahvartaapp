# Minimal HTTP-only config used during first-time SSL bootstrap.
# Replaced by nginx.conf after certificates are issued.
server {
    listen 80;
    listen [::]:80;
    server_name grahvarta.com www.grahvarta.com api.grahvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Grahvarta — deploying...";
        add_header Content-Type text/plain;
    }
}
