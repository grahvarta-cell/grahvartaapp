# /etc/nginx/conf.d/default.conf  (inside the nginx container)
# Service names resolve via Docker's internal DNS:
#   backend:3000  |  astrologer:80  |  admin:80

# ── HTTP — redirect to HTTPS + serve certbot ACME challenge ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grahvarta.com www.grahvarta.com api.grahvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API — api.grahvarta.com → backend:3000 ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/api.grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.grahvarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # WebSocket — Socket.io
    location /socket.io/ {
        proxy_pass             http://backend:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # Static uploads — serve via nginx (faster than Node)
    location /uploads/ {
        alias   /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # REST API
    location / {
        proxy_pass             http://backend:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  60s;
    }
}

# ── Frontend — grahvarta.com ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grahvarta.com www.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grahvarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Admin portal — /admin → admin container
    # The admin container keeps files under /admin/ internally,
    # so the full URI (e.g. /admin/assets/main.js) resolves correctly.
    location ^~ /admin {
        proxy_pass             http://admin:80;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # Backend API calls from admin portal (relative /api/...)
    location ^~ /api/ {
        proxy_pass             http://backend:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        client_max_body_size   20M;
    }

    # Astrologer portal SPA — everything else
    location / {
        proxy_pass             http://astrologer:80;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }
}
